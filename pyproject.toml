[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hivenayle-rulecheck"
version = "0.1.0"
description = "逐条执行校验规则，标出违反规则的记录与违反频次"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "hivenayle" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://hivenayle.github.io"
Repository = "https://github.com/hivenayle/rulecheck"
Issues = "https://github.com/hivenayle/rulecheck/issues"

[project.scripts]
rulecheck = "rulecheck:main"

[tool.setuptools]
py-modules = ["rulecheck"]
